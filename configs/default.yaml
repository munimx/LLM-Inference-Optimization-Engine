# Ollama Service Configuration
ollama:
  host: localhost
  port: 11434
  timeout_seconds: 300
  retry_count: 3
  retry_backoff_seconds: 1.0
  health_check_interval_seconds: 60

# API Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  log_level: INFO

# Model Configurations
models:
  mistral:
    name: "mistral:7b"
    context_length: 8192
    memory_gb: 4.1
    quantization: "4-bit"
    default_temperature: 0.7
    default_top_p: 0.9
  
  llama3:
    name: "llama3.1:8b"
    context_length: 8192
    memory_gb: 4.6
    quantization: "4-bit"
    default_temperature: 0.7
    default_top_p: 0.9
  
  phi3:
    name: "phi3:3.8b"
    context_length: 4096
    memory_gb: 2.0
    quantization: "4-bit"
    default_temperature: 0.7
    default_top_p: 0.9
  
  deepseek:
    name: "deepseek-r1:7b"
    context_length: 4096
    memory_gb: 4.4
    quantization: "4-bit"
    default_temperature: 0.7
    default_top_p: 0.9
