# vLLM Service Configuration
# List all vLLM instance URLs here — the BackendPool will round-robin across them.
vllm:
  instances:
    - url: "http://localhost:8080"
  timeout_seconds: 120
  retry_count: 2
  retry_backoff_seconds: 0.5
  health_check_interval_seconds: 15

# Redis Configuration
redis:
  url: "redis://localhost:6379/0"
  socket_timeout_seconds: 5.0

# API Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  log_level: INFO

# Cache Configuration
cache:
  enabled: true
  max_size: 256        # LRU eviction after this many entries
  ttl_seconds: 300.0   # entries older than this are treated as misses

# Admission Control (based on vLLM KV cache pressure)
admission_control:
  enabled: true
  soft_limit: 0.70    # QUEUE above this fraction (0.0–1.0)
  hard_limit: 0.90    # REJECT above this fraction (0.0–1.0)
  poll_interval_seconds: 5.0

# Circuit Breaker
circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30.0

# Model Registry
# Maps logical names to vLLM model IDs served by the backend.
# The router uses prompt token count to select fast vs. large model.
model_registry:
  fast_model: "mistralai/Mistral-7B-Instruct-v0.2"
  large_model: "meta-llama/Meta-Llama-3-70B-Instruct"
  fast_model_token_threshold: 512   # prompts shorter than this go to fast_model
  fallback_model: "mistralai/Mistral-7B-Instruct-v0.2"
  fallback_cache_similarity_threshold: 0.75
