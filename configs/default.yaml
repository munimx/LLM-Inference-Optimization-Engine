# Ollama Service Configuration
ollama:
  host: localhost
  port: 11434
  timeout_seconds: 300
  retry_count: 3
  retry_backoff_seconds: 1.0
  health_check_interval_seconds: 60

# API Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  log_level: INFO

# Model Configurations
models:
  mistral:
    name: "mistral:7b-instruct-q4_K_M"
    context_length: 8192
    memory_gb: 4.2
    quantization: "4-bit GPTQ"
    default_temperature: 0.7
    default_top_p: 0.9
  
  llama2:
    name: "llama2:13b-chat-q4_K_M"
    context_length: 4096
    memory_gb: 8.5
    quantization: "4-bit GPTQ"
    default_temperature: 0.7
    default_top_p: 0.9
  
  phi3:
    name: "phi3:3.8b-mini-instruct-4k-q4_K_M"
    context_length: 4096
    memory_gb: 2.8
    quantization: "4-bit GPTQ"
    default_temperature: 0.7
    default_top_p: 0.9
